apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-react
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitops-react
  template:
    metadata:
      labels:
        app: gitops-react
    spec:
      containers:
      - name: react-web
        image: ghcr.io/hemantp1234/my-react-gitops:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: react-service
spec:
  type: NodePort
  selector:
    app: gitops-react
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080