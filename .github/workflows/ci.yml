name: Build and Update Manifests
on:
  push:
    branches: [ master ]
    paths:
      - 'frontend/**'
      - 'Dockerfile'

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker Image
      run: |
        IMAGE_ID=ghcr.io/hemantp1234/my-react-gitops
        VERSION=${{ github.sha }}
        
        docker build -t $IMAGE_ID:$VERSION .
        docker push $IMAGE_ID:$VERSION
        
        # Update the K8s deployment file using sed
        sed -i "s|image: .*|image: $IMAGE_ID:$VERSION|g" k8s/deployment.yaml
        
    - name: Commit and Push YAML change
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "action@github.com"
        git add k8s/deployment.yaml
        git commit -m "Update image tag to $VERSION [skip ci]"
        git push