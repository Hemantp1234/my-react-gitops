name: Build and Update Manifests
on:
  push:
    branches: [ master ]
    paths:
      - 'frontend/**'
      - 'Dockerfile'
  pull_request:
    branches: [ master ]
    paths:
      - 'frontend/**'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_ID: ghcr.io/hemantp1234/my-react-gitops
      VERSION: ${{ github.sha }}
    steps:
    - uses: actions/checkout@v3

    - name: Build Docker Image
      run: docker build -t "$IMAGE_ID:$VERSION" .

  publish-and-update-manifest:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGE_ID: ghcr.io/hemantp1234/my-react-gitops
      VERSION: ${{ github.sha }}
    steps:
    - uses: actions/checkout@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker Image
      run: |
        docker build -t "$IMAGE_ID:$VERSION" .
        docker push "$IMAGE_ID:$VERSION"
        sed -i "s|image: .*|image: $IMAGE_ID:$VERSION|g" k8s/deployment.yml
        
    - name: Commit and Push YAML change
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "action@github.com"
        git add k8s/deployment.yml
        git commit -m "Update image tag to $VERSION [skip ci]"
        git push